name: Publish to PyPI

# Push a tag like `v0.1.0` to release. The tag must match the version in
# pyproject.toml, otherwise the build job fails before anything is uploaded.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  build:
    name: Build distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${version} in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --isolated --no-project --with "${wheel}[cli]" \
            python -c "import twocents; print(twocents.__version__)"
          uv run --isolated --no-project --with "${wheel}[cli]" tc --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name configured in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/twocents-xchange-rate/
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
