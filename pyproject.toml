[project]
name = "twocents-xchange-rate"
version = "0.2.0"
description = "Get exchange rates from Banca d'Italia. Available as a Python module and a CLI."
readme = "README.md"
authors = [
    { name = "FedericoCantarelli", email = "fede.cantarelli98@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests==2.34.2",
]

[project.optional-dependencies]
cli = [
    "click==8.4.2",
]

[project.scripts]
tc = "twocents.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "twocents-xchange-rate[cli]",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.build-backend]
# The distribution is `twocents-xchange-rate`, but the import package stays
# `twocents`.
module-name = "twocents"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
